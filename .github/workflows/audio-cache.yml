name: Audio cache sync

# Every 5 minutes, ask the site to cache the next batch of 红心 songs into
# R2. Each call is bounded (~20s, <=40 subrequests) so it stays inside the
# Cloudflare free plan; repeated calls work through the whole list.
# Authenticates with this repository's GitHub OIDC token: no secret to set.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: audio-cache-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # GitHub often delays or skips scheduled runs, so each run keeps working
    # batch after batch (fresh OIDC token each time) until the playlist is
    # complete or ~5.5 hours pass.
    timeout-minutes: 350
    steps:
      - name: Sync until complete
        run: |
          END=$(( $(date +%s) + 330 * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=music-audio-cache" | jq -r .value)
            BODY=$(curl -sS --max-time 90 -X POST \
              -H "Authorization: Bearer $TOKEN" \
              https://music.80007001.xyz/cron/audio-cache || echo '{}')
            echo "$(date -u +%H:%M:%S) $BODY"
            STATE=$(echo "$BODY" | jq -r '.state // empty' 2>/dev/null || true)
            if [ "$STATE" = "complete" ] || [ "$STATE" = "idle" ]; then break; fi
            sleep 40
          done
