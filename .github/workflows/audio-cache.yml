name: Audio cache sync

# Every 10 minutes, ask the site to cache the next batch of 红心 songs into
# Qiniu. Each call is bounded (~20s, <=40 subrequests) so it stays inside the
# Cloudflare free plan; repeated calls work through the whole list.
# Authenticates with this repository's GitHub OIDC token: no secret to set.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: audio-cache-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger bounded sync
        run: |
          TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=music-audio-cache" | jq -r .value)
          curl -sS --fail-with-body --max-time 90 -X POST \
            -H "Authorization: Bearer $TOKEN" \
            https://music.80007001.xyz/cron/audio-cache
          echo
