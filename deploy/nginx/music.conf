limit_req_zone $binary_remote_addr zone=otter_music_api:10m rate=10r/s;

log_format otter_music_sanitized '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name 193.112.217.24 music.80007001.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/otter-music-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 193.112.217.24 music.80007001.xyz;

    root /opt/otter-music/current/dist;

    ssl_certificate /etc/lego/certificates/193.112.217.24.crt;
    ssl_certificate_key /etc/lego/certificates/193.112.217.24.key;
    auth_basic "Otter Music";
    auth_basic_user_file /etc/nginx/otter-music.htpasswd;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:otter_music_ssl:10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/otter-music.access.log otter_music_sanitized;
    error_log /var/log/nginx/otter-music.error.log warn;

    include /etc/nginx/snippets/otter-music-security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    client_max_body_size 1m;

    location ~ ^/(?:health|proxy|music-api|sync(?:/v2)?)(?:/|$) {
        limit_req zone=otter_music_api burst=120 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Otter-Client-IP $remote_addr;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering on;
        proxy_read_timeout 10m;
        proxy_send_timeout 60s;
        proxy_intercept_errors off;
    }

    location = /sw.js {
        include /etc/nginx/snippets/otter-music-security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/otter-music-security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        default_type application/manifest+json;
    }

    location ^~ /assets/ {
        include /etc/nginx/snippets/otter-music-security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
